[package]
name = "tessera-relay"
version = "0.1.0"
description = "The first onion hop: a credential-blind relay that forwards a nested CONNECT to the credential-gated exit (tessera-proxy) without ever learning the final destination — the 2-hop split-trust loop."
readme = "README.md"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tessera-relay"
path = "src/main.rs"

# The local client proxy a person runs (lives here, not in `tessera-client`, to
# avoid a dependency cycle: this crate already depends on tessera-client). `doc =
# false` avoids a rustdoc output collision with the `tessera-client` library.
[[bin]]
name = "tessera-client"
path = "src/bin/tessera-client.rs"
doc = false

[dependencies]
# The relay reuses tessera-proxy's CONNECT/pipe/SOCKS5/OriginGuard logic for the
# EXIT hop; the relay hop itself is the new, credential-blind first hop.
tessera-arc = { path = "../tessera-arc" }
tessera-origin = { path = "../tessera-origin" }
tessera-client = { path = "../tessera-client" }
tessera-proxy = { path = "../tessera-proxy" }
# The relay is the channel COUNTERPARTY + per-request payment gate (DESIGN §1/§2):
# it holds a RelayerChannel and verify_and_cosigns each spend before forwarding.
tessera-channel = { path = "../tessera-channel" }
rand_core.workspace = true
hex.workspace = true

[dev-dependencies]
# The full-network integration test (tests/network.rs) stands up a real issuer.
tessera-issuer = { path = "../tessera-issuer" }
k256.workspace = true
