[package]
name = "tessera-client"
version = "0.1.0"
description = "Client-side ARC credential holder: attaches an unlinkable presentation to each request."
readme = "README.md"
publish = false # not published yet — flip after a third-party security audit
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tessera-arc = { path = "../tessera-arc" }
tessera-directory = { path = "../tessera-directory" }
# For obtaining a credential over the wire: reuse the issuer's PoW solver + the
# framed issuance protocol. (No cycle: tessera-issuer does not depend on us.)
tessera-issuer = { path = "../tessera-issuer" }
rand_core.workspace = true
hex.workspace = true
