[package]
name = "tessera-proxy"
version = "0.1.0"
description = "A credential-gated HTTP CONNECT proxy: admit on a Tessera credential (not an IP), tunnel TLS through Tor."
readme = "README.md"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tessera-proxy"
path = "src/main.rs"

[dependencies]
tessera-arc = { path = "../tessera-arc" }
tessera-origin = { path = "../tessera-origin" }
tessera-client = { path = "../tessera-client" }
# For the exit binary's convergent shared-key bootstrap (issuer↔exit ARC key).
tessera-issuer = { path = "../tessera-issuer" }
rand_core.workspace = true
libc.workspace = true

[dev-dependencies]
