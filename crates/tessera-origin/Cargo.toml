[package]
name = "tessera-origin"
version = "0.1.0"
description = "Server-side ARC presentation guard: admit anonymous requests on a credential, not on IP."
readme = "README.md"
publish = false # not published yet — flip after a third-party security audit
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Off by default so the core guard stays lean (no async/HTTP deps). Enabling
# `tower` pulls in tower + http + http-body-util to expose `TesseraLayer`, a
# drop-in middleware for any tower/axum/hyper service. These deps need a newer
# compiler than the core MSRV (1.74); see .github/workflows/ci.yml.
tower = ["dep:tower", "dep:http", "dep:http-body", "dep:http-body-util", "dep:bytes"]

[dependencies]
tessera-arc = { path = "../tessera-arc" }
hex.workspace = true

# Optional, behind the `tower` feature.
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tessera-client = { path = "../tessera-client" }
rand_core.workspace = true
# For the `tower` integration test (oneshot against a trivial inner service).
# `futures-executor` provides a tiny `block_on` so the test needs no full async
# runtime (no tokio) in this crate's dependency graph.
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
futures-executor = "0.3"
