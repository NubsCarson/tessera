[package]
name = "tessera-issuer"
version = "0.1.0"
description = "Proof-of-work issuance gate for Tessera ARC credentials — make obtaining a credential cost something."
readme = "README.md"
publish = false # not published yet — flip after a third-party security audit
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sha2.workspace = true
rand_core.workspace = true
# For the networked issuance endpoint (`net` module + the binary): the issuer is
# the ARC credential authority, so it needs the ARC issuance primitives + keys.
tessera-arc = { path = "../tessera-arc" }
hex.workspace = true
# Paid-mint gate (`mint` module): keccak256 for the ABI selectors + the
# proof-of-control digest, secp256k1 ecrecover to bind a request to the buyer's
# Ethereum address. Same EVM-native crypto the channel court uses.
sha3.workspace = true
k256 = { workspace = true }

[dev-dependencies]
hex.workspace = true

[[bin]]
name = "tessera-issuer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
