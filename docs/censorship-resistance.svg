<svg xmlns="http://www.w3.org/2000/svg" width="820" height="272" viewBox="0 0 820 272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Tokyo Night Storm -->
  <rect width="820" height="272" rx="12" fill="#24283b"/>
  <rect width="820" height="36" rx="12" fill="#1f2335"/>
  <rect y="24" width="820" height="12" fill="#1f2335"/>
  <circle cx="22" cy="18" r="6" fill="#f7768e"/>
  <circle cx="44" cy="18" r="6" fill="#e0af68"/>
  <circle cx="66" cy="18" r="6" fill="#9ece6a"/>
  <text x="410" y="23" fill="#565f89" text-anchor="middle" font-size="13"><tspan fill="#7dcfff" font-weight="bold">Tessera</tspan>  ·  both private AND uncensorable</text>

  <!-- arrows behind the boxes -->
  <g fill="#565f89" font-size="14">
    <text x="161" y="146">▸</text>
    <text x="318" y="146">▸</text>
    <text x="475" y="146">▸</text>
    <text x="632" y="146">▸</text>
  </g>
  <!-- arrow captions -->
  <text x="152" y="98" fill="#bb9af7" font-size="10" text-anchor="middle">disguised entry</text>
  <text x="623" y="98" fill="#9ece6a" font-size="10" text-anchor="middle">clean egress</text>

  <!-- 5 stages -->
  <g>
    <!-- 1: you -->
    <rect x="18" y="104" width="130" height="72" rx="8" fill="#1f2335" stroke="#3b4261"/>
    <text x="83" y="136" fill="#c0caf5" text-anchor="middle" font-size="14" font-weight="bold">you</text>
    <text x="83" y="156" fill="#565f89" text-anchor="middle" font-size="10">(local proxy)</text>

    <!-- 2: bridge (the disguise / uncensorable) -->
    <rect x="175" y="104" width="130" height="72" rx="8" fill="#1f2335" stroke="#bb9af7"/>
    <text x="240" y="132" fill="#bb9af7" text-anchor="middle" font-size="13" font-weight="bold">Tor bridge</text>
    <text x="240" y="150" fill="#c0caf5" text-anchor="middle" font-size="9">obfs4·snowflake·</text>
    <text x="240" y="163" fill="#c0caf5" text-anchor="middle" font-size="9">webtunnel — disguised</text>

    <!-- 3: Tor -->
    <rect x="332" y="104" width="130" height="72" rx="8" fill="#1f2335" stroke="#3b4261"/>
    <text x="397" y="136" fill="#7aa2f7" text-anchor="middle" font-size="13" font-weight="bold">Tor</text>
    <text x="397" y="156" fill="#565f89" text-anchor="middle" font-size="10">rendezvous · no exit node</text>

    <!-- 4: exit onion (the gate / private) -->
    <rect x="489" y="104" width="130" height="72" rx="8" fill="#1f2335" stroke="#9ece6a"/>
    <text x="554" y="132" fill="#7dcfff" text-anchor="middle" font-size="13" font-weight="bold">EXIT .onion</text>
    <text x="554" y="150" fill="#c0caf5" text-anchor="middle" font-size="9">single-use ARC token</text>
    <text x="554" y="163" fill="#c0caf5" text-anchor="middle" font-size="9">+ SSRF gate</text>

    <!-- 5: site -->
    <rect x="646" y="104" width="130" height="72" rx="8" fill="#1f2335" stroke="#3b4261"/>
    <text x="711" y="132" fill="#c0caf5" text-anchor="middle" font-size="13" font-weight="bold">the site</text>
    <text x="711" y="150" fill="#565f89" text-anchor="middle" font-size="9">sees a clean IP,</text>
    <text x="711" y="163" fill="#565f89" text-anchor="middle" font-size="9">never you (TLS e2e)</text>
  </g>

  <!-- honest footer -->
  <text x="18" y="206" fill="#9ece6a" font-size="11"><tspan font-weight="bold">private</tspan><tspan fill="#565f89">  unlinkable token per request, never your IP</tspan></text>
  <text x="18" y="224" fill="#bb9af7" font-size="11"><tspan font-weight="bold">uncensorable</tspan><tspan fill="#565f89">  enter through Tor's own bridges (reused, no new crypto)</tspan></text>
  <text x="18" y="250" fill="#565f89" font-size="10">research-grade · UNAUDITED · a real bridge population + clean-IP scale + a 3rd-party audit stay external</text>
</svg>
