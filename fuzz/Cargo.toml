[package]
name = "tessera-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hex = "0.4"
tessera-arc = { path = "../crates/tessera-arc" }
tessera-origin = { path = "../crates/tessera-origin" }
# For S6: fuzz the relay's outer-header channel decoders (untrusted wire input).
tessera-relay = { path = "../crates/tessera-relay" }
# For S21: the ARC issuance/presentation API is generic over `RngCore`, so the
# cross-crate lifecycle target needs the trait to drive a fuzz-seeded, fully
# deterministic RNG (no entropy from the OS — every byte string is reproducible).
rand_core = "0.6"

# A separate, nightly-only workspace so it doesn't perturb the main build.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "deserialize_element"
path = "fuzz_targets/deserialize_element.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deserialize_scalar"
path = "fuzz_targets/deserialize_scalar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_from_bytes"
path = "fuzz_targets/wire_from_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "presentation_verify"
path = "fuzz_targets/presentation_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "origin_guard_check"
path = "fuzz_targets/origin_guard_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_wire"
path = "fuzz_targets/channel_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arc_lifecycle"
path = "fuzz_targets/arc_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_parser"
path = "fuzz_targets/path_parser.rs"
test = false
doc = false
bench = false
