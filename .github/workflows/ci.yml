name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *" # daily: catch new RustSec advisories

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain (stable + clippy + rustfmt)
        # The repo's rust-toolchain.toml already selects stable; just ensure the
        # components are present on it (`component add` is variadic; the buggy
        # `--component clippy rustfmt` parsed `rustfmt` as a toolchain name).
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (the IETF known-answer vectors + robustness fuzzing live here)
        run: cargo test --workspace --all-features --locked

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run --locked

      - name: Docs (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV 1.74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.74.0
        run: |
          rustup toolchain install 1.74.0 --profile minimal
          rustup override set 1.74.0
      - name: Build on the declared MSRV
        run: cargo +1.74.0 build --workspace --all-features --locked

  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit the dependency graph
        run: cargo audit

  wasm:
    name: wasm browser client
    runs-on: ubuntu-latest
    # The wasm client lives in `crates/tessera-wasm`, a SEPARATE workspace
    # excluded from the root workspace (like `fuzz/`). It is built/tested here on
    # its own, never folded into the host `test`/`msrv` jobs, so its wasm-only
    # deps (getrandom `js`) can't perturb the native build.
    steps:
      - uses: actions/checkout@v6

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build tessera-wasm for wasm32 (the core deliverable)
        # RUSTFLAGS `-D warnings` (set workspace-wide above) still applies.
        run: |
          cargo build --manifest-path crates/tessera-wasm/Cargo.toml \
            --target wasm32-unknown-unknown --release

      - name: Clippy (deny warnings) on the wasm target
        run: |
          rustup component add clippy
          cargo clippy --manifest-path crates/tessera-wasm/Cargo.toml \
            --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Format check (wasm crate)
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path crates/tessera-wasm/Cargo.toml --all -- --check

      - name: Node (for the headless wasm-bindgen test runner)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-bindgen-cli (version pinned to the wasm-bindgen crate)
        # MUST equal the `wasm-bindgen` crate version in tessera-wasm/Cargo.toml,
        # or `wasm-bindgen-test-runner` rejects the module.
        # Clear the workspace-wide `-D warnings`: it must gate *our* code, not a
        # third-party tool's own crate (Cargo caps lints on deps, but the
        # top-level installed crate is not capped, so a future toolchain's new
        # lints could otherwise fail this install).
        env:
          RUSTFLAGS: ""
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Headless wasm round-trip test (mint -> present) via node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --manifest-path crates/tessera-wasm/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: Native fallback test of the identical mint -> present logic
        run: cargo test --manifest-path crates/tessera-wasm/Cargo.toml

  tower-e2e:
    name: tower middleware e2e (real axum server)
    runs-on: ubuntu-latest
    # tessera-tower-demo is its own excluded workspace (axum + tokio); the
    # end-to-end test stands up a real axum server on a multi-threaded tokio
    # runtime and drives it over a real socket. Built/tested here only.
    steps:
      - uses: actions/checkout@v6

      - name: Components
        run: rustup component add clippy rustfmt

      - name: Format check (demo crate)
        run: cargo fmt --manifest-path crates/tessera-tower-demo/Cargo.toml --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path crates/tessera-tower-demo/Cargo.toml --all-targets -- -D warnings

      - name: End-to-end test (admit / malformed / replay over real HTTP)
        run: cargo test --manifest-path crates/tessera-tower-demo/Cargo.toml

  contracts:
    name: contracts (Foundry on-chain court)
    runs-on: ubuntu-latest
    # The Phase 2c EVM court lives in `contracts/`, a self-contained Foundry
    # project (NOT a Cargo crate). Built/tested here on its own, like the wasm
    # and tower-e2e jobs. It is DEPENDENCY-FREE: no `forge install`, no git
    # submodule, no `lib/` — the test harness is vendored in `contracts/test/
    # Std.sol`, so only `solc` itself is fetched (by the Foundry toolchain).
    #
    # Two cross-language proofs run here, NEITHER needing external tooling:
    #   * CrossLanguageVector.t.sol pins a REAL Rust-signed state and verifies it
    #     via the contract's `ecrecover` path (Phase 2c).
    #   * RDecVerifier.t.sol pins a REAL R_dec Groth16 proof (generated locally by
    #     circuits/build.sh via circom+snarkjs) and verifies it on-chain through
    #     the committed RDecVerifier.sol (Phase 2b-i). CI needs NO circom/snarkjs —
    #     only the committed verifier + the pinned proof vector.
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry (forge + cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show toolchain versions
        run: forge --version && cast --version

      - name: forge build
        run: forge build

      - name: forge test (Rust->Solidity sig vector + the pinned R_dec ZK proof)
        run: forge test -vv

  fuzz:
    name: fuzz build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        run: rustup toolchain install nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # `+nightly` is required and overrides the repo's stable rust-toolchain.toml
      # (cargo-fuzz needs the nightly-only `-Z sanitizer` flags).
      - name: Build all fuzz targets
        run: cargo +nightly fuzz build

      - name: Smoke-run each target (short)
        # LeakSanitizer needs ptrace, which GitHub runners restrict; disable it.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "== fuzzing $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -detect_leaks=0
          done
