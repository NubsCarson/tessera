name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, with clippy + rustfmt)
        run: |
          rustup toolchain install stable --component clippy rustfmt
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (the IETF known-answer vectors + robustness fuzzing live here)
        run: cargo test --workspace --all-features

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  fuzz:
    name: fuzz build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build all fuzz targets
        run: cargo fuzz build

      - name: Smoke-run each target (short)
        # LeakSanitizer needs ptrace, which GitHub runners restrict; disable it.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          for t in $(cargo fuzz list); do
            echo "== fuzzing $t =="
            cargo fuzz run "$t" -- -max_total_time=30 -detect_leaks=0
          done
