[workspace]
resolver = "2"
members = [
    "crates/tessera-arc",
    "crates/tessera-origin",
    "crates/tessera-client",
    "crates/tessera-demo",
]
# The fuzz crate is its own (nightly-only) workspace; keep it out of the default build.
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NubsCarson/tessera"
authors = ["Tessera contributors"]

[workspace.dependencies]
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "hash2curve"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["hash2curve", "sec1"] }
crypto-bigint = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hex = "0.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3

# Optimize dependencies (notably the P-256 elliptic-curve ops) even in dev/test
# builds, while keeping our own crates unoptimized for fast, debuggable
# compiles. Without this, the constant-time EC arithmetic runs ~50x slower under
# `cargo test`, which makes the robustness/round-trip suites painfully slow.
[profile.dev.package."*"]
opt-level = 3
