[workspace]
resolver = "2"
members = [
    "crates/tessera-arc",
    "crates/tessera-origin",
    "crates/tessera-client",
    "crates/tessera-demo",
]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NubsCarson/tessera"
authors = ["Tessera contributors"]

[workspace.dependencies]
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "hash2curve"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["hash2curve", "sec1"] }
crypto-bigint = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hex = "0.4"

[profile.release]
opt-level = 3
