[workspace]
resolver = "2"
members = [
    "crates/tessera-arc",
    "crates/tessera-issuer",
    "crates/tessera-origin",
    "crates/tessera-directory",
    "crates/tessera-client",
    "crates/tessera-proxy",
    "crates/tessera-relay",
    "crates/tessera-channel",
    "crates/tessera-demo",
]
# Excluded, self-contained workspaces — each kept OUT of the host gates so its
# heavy/special deps can't perturb the MSRV-1.74 / clippy / test / doc build,
# and each has its own CI job:
#   fuzz                  — nightly-only cargo-fuzz targets
#   crates/tessera-wasm   — wasm32-only deps (getrandom `js`)
#   crates/tessera-tower-demo — axum + tokio (real-HTTP middleware e2e)
exclude = ["fuzz", "crates/tessera-wasm", "crates/tessera-tower-demo"]

[workspace.package]
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NubsCarson/tessera"
authors = ["Tessera contributors"]
keywords = ["anonymous", "credentials", "privacy", "cryptography", "tor"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "hash2curve"] }
# secp256k1 (the EVM-native curve). Same RustCrypto `ecdsa`/`elliptic-curve`
# 0.13 family as `p256`, so the workspace shares one ECDSA stack. Used by
# `tessera-channel` for the CHAIN-FACING state signatures so an EVM contract can
# recover the signer with `ecrecover` (see crates/tessera-channel Phase 2c).
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["hash2curve", "sec1"] }
crypto-bigint = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
# Poseidon over BN254 Fr for the Phase 2b-i ZK commitment (tessera-channel). The
# version pins are load-bearing for the MSRV-1.74 gate: ark-* 0.5 requires rustc
# 1.75, so we hold ark at 0.4 and light-poseidon at the 0.2.x line that targets
# ark 0.4. `new_circom(n)` matches circomlib `Poseidon(n)` byte-for-byte.
light-poseidon = { version = "=0.2.0", default-features = false }
ark-bn254 = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
hex = "0.4"
libc = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3

# Optimize dependencies (notably the P-256 elliptic-curve ops) even in dev/test
# builds, while keeping our own crates unoptimized for fast, debuggable
# compiles. Without this, the constant-time EC arithmetic runs ~50x slower under
# `cargo test`, which makes the robustness/round-trip suites painfully slow.
[profile.dev.package."*"]
opt-level = 3
