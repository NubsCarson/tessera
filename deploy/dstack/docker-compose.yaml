# Tessera nodes for a dstack (Phala/Flashbots-style) Intel TDX TEE deployment.
# See docs/DEPLOY.md. This differs from ../docker-compose.yaml in two ways:
#   1. it uses a PUBLISHED image (a TEE pulls from a registry; build + push first),
#   2. it mounts /var/run/dstack.sock — the dstack guest-agent socket — into each
#      node for TDX remote-attestation quotes and future KMS key derivation.
#
# Why a TEE here (the trust axis, not the clean-IP axis): the RELAY sees
# {client, exit} and must not log or collude. In an attested enclave a client can
# VERIFY the running node matches this open-source image under dstack/TDX
# attestation assumptions. The ARC server key for this exit domain is DERIVED from
# the dstack guest agent (GetKey over the mounted socket) and sealed to the enclave
# (never leaves it) — TESSERA_KEY_PROVIDER=dstack-kms, set on the exit below. That
# provider is IMPLEMENTED (std-only client) and fails closed off-TEE, but is proven
# only against a mock / the dstack simulator, NOT real TDX hardware. The egress IP
# is still the TEE host's (a datacenter IP) — TEE does NOT solve clean egress.
#
# Scope note: this TEE variant intentionally wires only the relay + exit. The
# issuer/client + real KMS key-domain bootstrap (the file-volume approach in
# ../docker-compose.yaml) are DEFERRED here.
# Additional independent exits must be separate key domains, not clones sharing
# one ARC verifier secret.
#
# Generate the deployment manifest + deploy (dstack VMM CLI):
#   ./vmm-cli.py compose --docker-compose deploy/dstack/docker-compose.yaml \
#       --name tessera --kms --gateway --public-logs --output app-compose.json
#   ./vmm-cli.py deploy --name tessera --compose app-compose.json --vcpu 2 --memory 2G

services:
  exit:
    image: ${TESSERA_IMAGE:-ghcr.io/nubscarson/tessera-node:0.1.0}
    command: ["tessera-proxy"]
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      TESSERA_LISTEN: "0.0.0.0:8118"
      TESSERA_UPSTREAM: "direct"
      # Derive the ARC server key from the dstack KMS via the guest agent, sealed to
      # the enclave (never on disk). Fails closed if the socket is unreachable.
      TESSERA_KEY_PROVIDER: "dstack-kms"
      TESSERA_DSTACK_KMS_KEY_ID: "tessera/arc-server-key"
    restart: unless-stopped

  relay:
    image: ${TESSERA_IMAGE:-ghcr.io/nubscarson/tessera-node:0.1.0}
    command: ["tessera-relay"]
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      TESSERA_RELAY_LISTEN: "0.0.0.0:8119"
      TESSERA_EXIT_ADDR: "exit:8118"
    depends_on:
      - exit
    restart: unless-stopped
